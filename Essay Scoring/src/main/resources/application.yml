server:
  port: 8080

# 应用自定义配置
app:
  cors:
    # 允许的前端来源（多个用逗号分隔），生产环境请改为具体域名
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080}

spring:
  application:
    name: essay-scoring-system

  # 数据源配置（H2 文件数据库 — 数据持久化到磁盘，重启不丢失）
  datasource:
    url: jdbc:h2:file:./data/essayscoring;MODE=MySQL;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:}          # ★ 生产必须通过环境变量注入

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate               # ★ 生产用 validate + 迁移脚本
    show-sql: false
    open-in-view: false                # ★ 关掉 OSIV（连接持有到视图渲染结束是隐患）
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # H2 控制台（默认关闭，开发环境在 application-dev.yml 里开启）
  h2:
    console:
      enabled: false
      path: /h2-console

  # DeepSeek API 配置
  cloud:
    ai:
      deepseek:
        # API Key - 从环境变量 DEEPSEEK_API_KEY 获取
        api-key: ${DEEPSEEK_API_KEY:your-api-key-here}
        # 模型配置
        chat:
          options:
            model: deepseek-chat
            temperature: 0.3
            max-tokens: 4000           # ★ 2000 会截断输出，导致 JSON 不完整

# JWT 配置
jwt:
  # JWT 签名密钥（Base64 编码），必须由环境变量提供，不设默认值
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000   # 24 小时

# 日志配置
logging:
  level:
    root: INFO
    com.study.ai.essayscoring: INFO    # ★ 默认 INFO，需要排查时临时开 DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
